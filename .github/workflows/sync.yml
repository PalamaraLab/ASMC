name: Sync

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  private-to-public:
    if: github.repository == 'PalamaraLab/ASMC_dev'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Mirror main to public repo
        env:
          DEPLOY_ACCESS_TOKEN: ${{ secrets.DEPLOY_ACCESS_TOKEN }}
        run: |
          remote_repo="https://fcooper8472:${DEPLOY_ACCESS_TOKEN}@github.com/PalamaraLab/ASMC.git"
          git fetch "${remote_repo}" main
          # Push only fast-forwards. A run that starts from a stale commit
          # (or the echo of a sync push) must never overwrite newer work.
          if git merge-base --is-ancestor HEAD FETCH_HEAD; then
            echo "Public main already contains this commit. No push needed."
          elif git merge-base --is-ancestor FETCH_HEAD HEAD; then
            git push "${remote_repo}" HEAD:main --follow-tags
            echo "Fast-forwarded public main."
          else
            echo "::error::Private and public main have diverged. Not pushing; reconcile them by hand."
            exit 1
          fi

  public-to-private:
    if: github.repository == 'PalamaraLab/ASMC'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Mirror main to private repo
        env:
          DEPLOY_ACCESS_TOKEN: ${{ secrets.DEPLOY_ACCESS_TOKEN }}
        run: |
          remote_repo="https://fcooper8472:${DEPLOY_ACCESS_TOKEN}@github.com/PalamaraLab/ASMC_dev.git"
          git fetch "${remote_repo}" main
          # Push only fast-forwards. A run that starts from a stale commit
          # (or the echo of a sync push) must never overwrite newer work.
          if git merge-base --is-ancestor HEAD FETCH_HEAD; then
            echo "Private main already contains this commit. No push needed."
          elif git merge-base --is-ancestor FETCH_HEAD HEAD; then
            git push "${remote_repo}" HEAD:main --follow-tags
            echo "Fast-forwarded private main."
          else
            echo "::error::Public and private main have diverged. Not pushing; reconcile them by hand."
            exit 1
          fi
