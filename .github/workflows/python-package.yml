name: Build python wheels

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_wheels_cloud:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    if: github.event_name == 'pull_request' || github.repository == 'PalamaraLab/ASMC'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x86_64
            py-vers-full: cp39-* cp310-* cp311-* cp312-* cp313-* cp314-*
            py-vers-pr: cp311-*
            before-all: dnf -y install boost-devel zlib
            extra-env: ""
            mdt: ""
          - os: ubuntu-24.04-arm
            arch: aarch64
            py-vers-full: cp39-* cp310-* cp311-* cp312-* cp313-* cp314-*
            py-vers-pr: cp312-*
            before-all: dnf -y install boost-devel zlib
            extra-env: ""
            mdt: ""
          - os: macos-15-intel
            arch: x86_64
            py-vers-full: cp39-* cp310-* cp311-* cp312-* cp313-* cp314-*
            py-vers-pr: cp313-*
            before-all: brew install boost zlib
            extra-env: CC=clang CXX=clang++
            mdt: 15
          - os: macos-14
            arch: arm64
            py-vers-full: cp39-* cp310-* cp311-* cp312-* cp313-* cp314-*
            py-vers-pr: cp314-*
            before-all: brew install boost zlib
            extra-env: CC=clang CXX=clang++
            mdt: 14

    env:
      CIBW_BUILD: ${{ github.event_name != 'pull_request' && matrix.py-vers-full || matrix.py-vers-pr }}
      CIBW_SKIP: cp3*-musllinux_*
      CIBW_ARCHS: ${{ matrix.arch }}
      CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
      CIBW_BEFORE_ALL: ${{ matrix.before-all }}
      CIBW_BEFORE_BUILD: pip install --upgrade pip setuptools wheel ninja numpy cython
      CIBW_ENVIRONMENT: ${{ matrix.extra-env }}
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.mdt }}

    steps:

      - name: checkout repo & submodules
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: true
          fetch-depth: 0
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@7c619efba910c04005a835b110b057fc28fd6e93 # v3.2.0

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wheels-cloud-${{ matrix.os }}
          path: ./wheelhouse/*.whl
          retention-days: 1

  upload_all:
    name: Upload to PyPI
    needs: [build_wheels_cloud]
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'release' && github.event.action == 'published' && github.repository == 'PalamaraLab/ASMC' }}
    environment: release
    permissions:
      id-token: write  # for PyPI Trusted Publishing

    steps:
      - name: Download wheels from cloud runners
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          pattern: wheels-cloud-*
          merge-multiple: true
          path: wheels

      - uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.13.0
        with:
          packages_dir: wheels/
