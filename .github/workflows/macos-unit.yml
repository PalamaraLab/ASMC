name: "Unit tests: macOS"

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - 'notebooks/**'
      - '**.md'
      - '.readthedocs.yaml'
  pull_request:
    branches:
      - '**'
    types: [opened, synchronize, reopened, labeled]
    paths-ignore:
      - 'docs/**'
      - 'notebooks/**'
      - '**.md'
      - '.readthedocs.yaml'
  schedule:
    - cron: '0 4 * * 1'  # Every Monday at 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read

# Cancel a PR's previous run when a new commit is pushed. A run started by adding a label waits
# instead of cancelling, so labelling a PR never cancels a full-ci run already in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'labeled' }}

jobs:

  build-and-test:
    name: Unit tests on macOS
    runs-on: ${{ matrix.os }}
    # macOS minutes are billed at about 10x Linux on the private repo, so this runs there only for
    # PRs labelled full-ci or on manual dispatch. The public repo runs it for every event. Adding
    # any other label is ignored.
    if: >-
      (github.event.action != 'labeled' || github.event.label.name == 'full-ci')
      && (github.repository == 'PalamaraLab/ASMC'
          || github.event_name == 'workflow_dispatch'
          || contains(github.event.pull_request.labels.*.name, 'full-ci'))
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15

    steps:

      - name: checkout repo & submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          fetch-depth: 0
          persist-credentials: false

      - name: install dependencies
        run: |
          brew install boost zlib

      - name: make build directory
        run: mkdir -p build_dir

      - name: cmake configure
        run: cmake ..
        working-directory: build_dir

      - name: cmake build
        run: cmake --build . --parallel 3 --target ASMC_unit_tests
        working-directory: build_dir

      - name: cmake test
        run: ctest -j2 -R '^unit:' --output-on-failure
        working-directory: build_dir
