name: Audit workflows with zizmor

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '**'
  schedule:
    - cron: '15 3 * * 1'  # Every Monday at 03:15 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zizmor:
    name: Audit workflows with zizmor
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Annotate findings and fail the job. Results are not uploaded to the Security tab, which
      # needs GitHub Advanced Security on this private repository.
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          version: 1.31.1
          advanced-security: false
          annotations: true
