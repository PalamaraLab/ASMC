name: Audit workflows with zizmor

on:
  push:
    branches:
      - main
    paths:
      - '.github/**'
  pull_request:
    branches:
      - '**'
    paths:
      - '.github/**'
  schedule:
    - cron: '15 3 * * 1'  # Every Monday at 03:15 UTC
  workflow_dispatch:

permissions:
  contents: read

# Cancel a PR's previous run when a new commit is pushed. Other events are grouped by commit SHA,
# so pushes to main never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  zizmor:
    name: Audit workflows with zizmor
    runs-on: ubuntu-26.04
    # The weekly run catches newly published advisories. Both repos hold the same workflows, so
    # it runs on the public repo only, where minutes are free.
    if: github.event_name != 'schedule' || github.repository == 'PalamaraLab/ASMC'
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Annotate findings and fail the job. Results are not uploaded to the Security tab, which
      # needs GitHub Advanced Security on this private repository.
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          version: 1.31.1
          advanced-security: false
          annotations: true
