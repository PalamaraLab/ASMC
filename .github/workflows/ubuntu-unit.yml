name: "Unit tests: Ubuntu"

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - 'notebooks/**'
      - '**.md'
      - '.readthedocs.yaml'
  pull_request:
    branches:
      - '**'
    paths-ignore:
      - 'docs/**'
      - 'notebooks/**'
      - '**.md'
      - '.readthedocs.yaml'
  schedule:
    - cron: '0 4 * * 1'  # Every Monday at 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read

# Cancel a PR's previous run when a new commit is pushed. Other events are grouped by commit SHA,
# so pushes to main never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  # Builds once and runs both the unit and regression tests, to save a second configure and build.
  build-and-test:
    name: Unit and regression tests on Ubuntu
    runs-on: ubuntu-24.04
    env:
      CXX: g++-14
    # Runs on every PR in the private repo; on the public repo it runs for every event.
    if: >-
      github.repository == 'PalamaraLab/ASMC'
      || github.event_name == 'pull_request'
      || github.event_name == 'workflow_dispatch'
    timeout-minutes: 15

    steps:

      - name: checkout repo & submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          fetch-depth: 0
          persist-credentials: false

      - name: install deps
        run: |
          sudo apt -y update
          sudo apt -y install libboost-iostreams-dev libboost-program-options-dev zlib1g-dev

      - name: make build directory
        run: mkdir -p build_dir

      # Release build to match the regression snapshot data.
      - name: cmake configure
        run: cmake .. -DCMAKE_BUILD_TYPE=Release
        working-directory: build_dir

      - name: cmake build
        run: cmake --build . --parallel 4 --target ASMC_unit_tests ASMC_regression
        working-directory: build_dir

      - name: cmake test
        run: ctest -j2 -R Asmc_unit_tests --output-on-failure
        working-directory: build_dir

      - name: regression test
        run: ctest -R regression --output-on-failure
        working-directory: build_dir
